[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opengate-mcp"
version = "0.3.0"
description = "Reusable local OpenGate provider client and project MCP runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencode-ai==0.1.0a36",
]

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
opengate = "opengate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"
